<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Audio Debug 2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0f; color: #e8e8ff; font-family: monospace; padding: 20px; font-size: 14px; }
h2 { color: #00E5FF; margin-bottom: 16px; font-size: 16px; }
button {
  display: block; width: 100%; padding: 22px;
  margin: 10px 0; font-size: 17px; font-weight: bold;
  background: #1a1a30; color: #00E5FF;
  border: 2px solid #00E5FF; border-radius: 10px; cursor: pointer;
}
#log {
  margin-top: 16px; padding: 12px; background: #000;
  border: 1px solid #333; border-radius: 8px;
  min-height: 160px; font-size: 13px; line-height: 2;
  white-space: pre-wrap; overflow-y: auto; max-height: 360px;
}
.ok   { color: #39FF14; }
.fail { color: #FF2A6D; }
.info { color: #FFE000; }
.t    { color: #606880; }
</style>
</head>
<body>
<h2>🔊 iOS touchstart vs click 비교</h2>

<!-- A: touchstart에서 처리 -->
<button id="btnA">A: touchstart에서 beep</button>

<!-- B: touchend에서 처리 -->
<button id="btnB">B: touchend에서 beep</button>

<!-- C: onclick에서 처리 (기존 방식) -->
<button id="btnC" onclick="handleC()">C: onclick에서 beep</button>

<!-- D: touchstart unlock + onclick beep -->
<button id="btnD">D: touchstart unlock → onclick beep</button>

<button onclick="document.getElementById('log').innerHTML=''" style="border-color:#555;color:#555;padding:10px">로그 초기화</button>

<div id="log">버튼을 눌러 테스트하세요.\n</div>

<script>
let ctxA=null, ctxB=null, ctxC=null, ctxD=null;
let dUnlocked = false;

function ts(){ return '<span class="t">['+new Date().toISOString().slice(11,22)+']</span> '; }
function log(msg,cls){ const d=document.getElementById('log'); d.innerHTML+=ts()+'<span class="'+(cls||'')+'">'+msg+'</span>\n'; d.scrollTop=d.scrollHeight; }

function beep(ctx, freq, label){
  try{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq||880;
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.4, t);
    g.gain.linearRampToValueAtTime(0.0001, t+0.4);
    o.start(t); o.stop(t+0.45);
    log((label||'beep')+' ✅ state='+ctx.state+' t='+t.toFixed(4),'ok');
  }catch(e){ log((label||'beep')+' ❌ '+e.message,'fail'); }
}

// A: touchstart에서 전부 처리
document.getElementById('btnA').addEventListener('touchstart', function(e){
  e.preventDefault();
  log('--- A: touchstart ---','info');
  ctxA = new(window.AudioContext||window.webkitAudioContext)();
  log('created: state='+ctxA.state);
  ctxA.resume().then(()=>{
    log('resumed: state='+ctxA.state+' t='+ctxA.currentTime.toFixed(4));
    beep(ctxA, 880, 'A');
  });
}, {passive:false});

// B: touchend에서 처리
document.getElementById('btnB').addEventListener('touchend', function(e){
  e.preventDefault();
  log('--- B: touchend ---','info');
  ctxB = new(window.AudioContext||window.webkitAudioContext)();
  ctxB.resume().then(()=>{
    log('resumed: state='+ctxB.state+' t='+ctxB.currentTime.toFixed(4));
    beep(ctxB, 660, 'B');
  });
}, {passive:false});

// C: onclick (기존 방식)
function handleC(){
  log('--- C: onclick ---','info');
  ctxC = new(window.AudioContext||window.webkitAudioContext)();
  ctxC.resume().then(()=>{
    log('resumed: state='+ctxC.state+' t='+ctxC.currentTime.toFixed(4));
    beep(ctxC, 440, 'C');
  });
}

// D: touchstart로 unlock, onclick으로 beep
document.getElementById('btnD').addEventListener('touchstart', function(e){
  log('--- D: touchstart unlock ---','info');
  if(!ctxD) ctxD = new(window.AudioContext||window.webkitAudioContext)();
  ctxD.resume().then(()=>{
    dUnlocked = true;
    log('D unlocked: state='+ctxD.state,'ok');
  });
}, {passive:true});
document.getElementById('btnD').addEventListener('click', function(){
  log('--- D: click beep ---','info');
  if(!ctxD){ log('ctxD null','fail'); return; }
  log('state='+ctxD.state+' unlocked='+dUnlocked);
  beep(ctxD, 1100, 'D');
});
</script>
</body>
</html>
